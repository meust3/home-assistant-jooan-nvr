name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate tag and manifest versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag is not valid semantic versioning" >&2
            exit 1
          fi
          version="${tag#v}"
          manifest_version="$(python -c 'import json; print(json.load(open("custom_components/jooan_nvr/manifest.json"))["version"])')"
          test "$version" = "$manifest_version"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run release validation
        run: |
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q custom_components jooan_discovery tests scripts
          python scripts/validate_isolation.py
          python scripts/validate_hacs.py

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build deterministic manual-install assets
        run: python scripts/build_release.py --version "${GITHUB_REF_NAME#v}"
        shell: bash
      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            $0 == heading { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="dist/jooan-nvr-${GITHUB_REF_NAME}.zip"
          checksum="${archive}.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md --latest
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md --latest --verify-tag
          fi

