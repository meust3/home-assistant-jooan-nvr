[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jooan-nvr-discovery"
version = "0.1.2"
description = "Conservative local-network discovery and protocol investigation for JOOAN/EseeCloud NVRs"
readme = "README.md"
requires-python = ">=3.14.2"
license = { text = "MIT" }
dependencies = [
  "cryptography>=42",
  "manuf>=1.1.5",
  "psutil>=5.9",
  "websockets>=14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-homeassistant-custom-component==0.13.363",
  "aiodhcpwatcher==1.2.7",
  "aiodiscover==3.3.2",
  "av==18.1.0",
  "cached-ipaddress==1.1.2",
  "PyTurboJPEG==1.8.3",
  "ruff>=0.9",
]

[project.scripts]
jooan-discover = "jooan_discovery.cli:main"

[tool.setuptools.packages.find]
include = ["jooan_discovery*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
